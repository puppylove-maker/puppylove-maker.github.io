<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 보관함</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff;--text:#111111;--sub:#555555;--muted:#9a9a9a;--line:#ececec;--soft:#f5f5f5;--danger:#c0392b;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea,select{outline:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px;min-height:calc(100vh / var(--z,1));display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;min-height:32px}
.title{display:flex;align-items:center;gap:2px;min-width:0}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:none;background:none;font:inherit;font-size:24px;line-height:1;padding:0 8px 4px 0;cursor:pointer;color:var(--text)}
.row{display:flex;gap:6px;align-items:center}
.desc{white-space:pre-wrap;word-break:break-word;color:var(--sub);font-size:13px;line-height:1.6;margin:4px 0 20px}
.hbtns{display:flex;gap:6px;position:relative;flex:none}
.icon-btn{width:30px;height:30px;border-radius:10px;border:none;background:none;color:#888;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:16px;height:16px}
.icon-btn.plus{color:#555}
.icon-btn.plus svg{transition:transform .3s var(--ease)}
.icon-btn.plus.on svg{transform:rotate(45deg)}
/* 그룹: 제목 옆 화살표 + 알약 */
.title-chev{border:none;background:none;padding:4px;margin-left:2px;color:#999;cursor:pointer;display:grid;place-items:center;flex:none}
.title-chev svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.title-chev.on svg{transform:rotate(180deg)}
.gacc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease),margin .32s var(--ease)}
.gacc>div{overflow:hidden}
.gacc.open{grid-template-rows:1fr;margin-top:-10px;margin-bottom:14px}
.pills{display:flex;flex-wrap:nowrap;gap:6px;padding:2px 16px 2px 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.pills .pill{flex:none;scroll-snap-align:start}
.pill{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on{background:#f1f1f1;border-color:#f1f1f1;color:var(--text);font-weight:600}
.pill.add{border-style:dashed;color:var(--muted)}
.pill.edit{border:none;background:none;color:var(--muted);padding:0 8px;font-size:12px}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
#gmList .oarrow svg{width:15px;height:15px}
#gmList .orow{gap:6px;padding-left:14px}
#gmList .oarrow{width:32px;height:32px}
.gorder{display:flex;align-items:center;gap:6px}
.gorder .oarrow{flex:none;font-size:18px;line-height:1}
.gorder-list{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.gorder-list::-webkit-scrollbar{display:none}
.gorder-list .pill{flex:none;height:28px;font-size:12px;cursor:default;display:inline-flex;align-items:center;transition:transform .25s var(--ease)}
/* + 메뉴 */
.menu{position:absolute;top:42px;right:0;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:6px;z-index:20;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .18s var(--ease),transform .22s var(--ease)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:none;background:none;padding:10px 12px;border-radius:10px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;text-align:left}
.menu button:hover{background:var(--soft)}
.menu small{font-size:11px;color:var(--muted);margin-top:1px}
/* 박스 디자인: 오버레이 */
.lo-overlay .pimg{margin-bottom:0}
.ov-cap{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:30px 10px 10px 14px;background:linear-gradient(to top,rgba(255,255,255,.92),rgba(255,255,255,0))}
.ov-cap .phint{color:#777}
.lo-overlay .pimg.no-pic{aspect-ratio:auto;min-height:110px;background:var(--soft)}
/* 박스 디자인: 가로형 */
.pside{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:14px;cursor:pointer}
.sthumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#e9e9e9;flex:none}
.sbody{flex:1;min-width:0;display:grid;gap:2px}
.sbody .ptitle{max-width:none}
.pside .edit-ic{position:static;width:28px;height:28px}
.pside .edit-ic svg{filter:none}
/* 박스 디자인: 텍스트 카드 */
.ptext{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;min-height:48px;border-radius:14px;cursor:pointer;position:relative}
.ptext .ptitle{max-width:60%}
.tsnip{font-size:12px;color:var(--sub);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.ptext .tfoot{display:flex;justify-content:space-between;align-items:center}
.ptext .edit-ic{position:static;width:28px;height:28px}
.ptext .edit-ic svg{filter:none}
/* 디자인 미리보기 (템플릿 고르기) */
.lo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lo-card{display:grid;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:inherit;font-size:12px;color:var(--sub);cursor:pointer;text-align:left}
.lo-card.on{border-color:#bdbdbd;background:var(--soft)}
/* 박스 디자인 변경 (아코디언) */
.acc{border:1px solid var(--line);border-radius:10px;background:#fff}
.acc-head{width:100%;display:flex;align-items:center;gap:8px;border:none;background:none;padding:10px 12px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;text-align:left}
.acc-head span:first-child{flex:1}
.acc-cur{font-size:12px;color:var(--muted)}
.acc-head svg{width:16px;height:16px;color:#999;transition:transform .3s var(--ease)}
.acc.open .acc-head svg{transform:rotate(180deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.acc-body>div{overflow:hidden}
.acc.open .acc-body{grid-template-rows:1fr}
.acc .lo-grid{padding:0 10px 10px}
/* 수정 창 안의 작은 디자인 선택 */
.lo-grid.compact{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.lo-grid.compact::-webkit-scrollbar{display:none}
.lo-grid.compact .lo-card{flex:0 0 78px;scroll-snap-align:start}
.lo-grid.compact .lo-card{padding:6px;gap:5px;border-radius:10px;font-size:11px;text-align:center}
.lo-grid.compact .lo-card .d{display:none}
.lo-grid.compact .mini{height:40px}
.lo-grid.compact .mini .im{height:22px}.lo-grid.compact .mini .bar{height:9px}
.lo-grid.compact .mini.ov .im{height:38px}.lo-grid.compact .mini.ov .bar{bottom:6px;height:7px}
.lo-grid.compact .mini.sd{grid-template-columns:16px 1fr;height:40px}.lo-grid.compact .mini.sd .im{height:16px}.lo-grid.compact .mini.sd .bar{height:7px}
.lo-grid.compact .mini.tx .bar{height:7px}.lo-grid.compact .mini.tx .ln{height:4px}
.mini{display:grid;gap:3px;height:62px;align-content:start}
.mini i{display:block;background:#e4e4e4;border-radius:5px}
.mini .im{height:36px}.mini .bar{height:14px;background:#efefef}
.mini.ov{position:relative}.mini.ov .im{height:56px}.mini.ov .bar{position:absolute;left:4px;right:4px;bottom:9px;height:10px;background:#fafafa}
.mini.sd{grid-template-columns:28px 1fr;align-items:center;height:62px;align-content:center}.mini.sd .im{height:28px}.mini.sd .bar{height:10px}
.mini.tx .bar{height:10px}.mini.tx .ln{height:6px;background:#efefef}
.mini.tl{grid-template-columns:repeat(2,1fr);gap:4px}.mini.tl.t3{grid-template-columns:repeat(3,1fr)}.mini.tl .im{height:46px}
.lo-grid.compact .mini.tl .im{height:36px}
/* 템플릿 */
.tpl-list{display:grid;gap:8px;max-height:60vh;overflow:auto}
.tpl{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.tpl b{font-size:14px}
.tpl span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 관리 줄 (폴더 편집 / 순서 바꾸기) */
.admin-bar{display:flex;gap:4px;margin:-6px 0 12px}
.link{border:none;background:none;font:inherit;font-size:12px;color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer}
.link:hover{background:var(--soft);color:var(--sub)}
.link:first-child{margin-left:-8px}
footer{display:flex;justify-content:center;gap:4px;padding-top:40px}

.press{transition:transform .38s cubic-bezier(.34,1.56,.64,1),background-color .18s var(--ease),border-color .18s var(--ease),opacity .18s;touch-action:manipulation}
.press.is-pressed{transform:scale(.95);transition:transform .12s var(--ease),background-color .12s,opacity .12s}
.pimg.press.is-pressed,.pbar.press.is-pressed,.folder.press.is-pressed{transform:scale(.98)}
#view.enter{animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog.closing{animation:pop-out .16s var(--ease) forwards}
dialog.closing::backdrop{opacity:0;transition:opacity .16s}
@keyframes pop-out{to{opacity:0;transform:translateY(6px) scale(.98)}}

.item{display:grid;grid-template-columns:minmax(0,1fr);min-width:0}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--ease),opacity .3s var(--ease),margin .36s var(--ease);opacity:0}
.expand>div{overflow:hidden}
.item.open .expand{grid-template-rows:1fr;opacity:1;margin-top:4px}
.expand-inner{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.45;color:var(--sub);background:var(--soft);border-radius:12px;padding:12px 14px}

.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);height:30px;padding:0 10px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:#f1f1f1;border-color:#f1f1f1;color:var(--text);font-weight:600}
.btn.primary:hover{background:#e8e8e8}
.btn.ghost{border-color:transparent;color:var(--sub);background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5}

select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:16px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;transition:border-color .15s}
input:focus,textarea:focus{border-color:#cfcfcf}
textarea{min-height:140px;resize:vertical;line-height:1.55}
textarea.short{min-height:70px}
textarea.scroll-box{min-height:0;height:96px;resize:none;overflow-y:auto}

.box{border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.list{display:grid;gap:10px}
.media{position:absolute;inset:0;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}

.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px 14px;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-white .cap{color:var(--text);background:linear-gradient(to top,rgba(255,255,255,.85),rgba(255,255,255,0))}
.g-black .cap{color:#fff;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0))}
.g-none .cap{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.no-img .cap{top:0;bottom:0;display:flex;align-items:center;padding:0 16px;color:var(--text);background:none;text-shadow:none}

.folder{position:relative;display:block;width:100%;aspect-ratio:var(--fr,4/1);padding:0;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer}
/* 그룹: 카드가 겹쳐 쌓인 모양 */
.folder.group{overflow:visible;box-shadow:0 5px 0 -2px #fff,0 5px 0 -1px var(--line),0 10px 0 -4px #fff,0 10px 0 -3px #ececec;margin-bottom:8px}
.folder.group .media{border-radius:13px}

.plist{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:16px;column-gap:12px}
.plist>.item{width:100%}
.plist>.item.lo-tall2{width:calc((100% - 12px) / 2)}
.plist>.item.lo-tall3{width:calc((100% - 24px) / 3)}
/* 세로형 카드 */
.ptall{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;cursor:pointer}
.ptall.no-pic{display:grid;place-items:center}
.tall-info{display:grid;gap:6px;padding:8px 2px 0;min-width:0}
.tall-info .ptitle{max-width:none;font-size:13px}
.lo-tall3 .tall-info .ptitle{font-size:12px}
.plist .item .tall-info .copies{display:flex;flex-wrap:wrap;gap:4px;max-width:none;width:100%;margin:0;overflow:visible;justify-content:flex-start}
.plist .item .tall-info .copy-btn{flex:1 1 40%;min-width:0;height:28px;padding:0 6px;font-size:11.5px}
.tall-cap{display:grid!important;gap:6px;padding:28px 8px 8px!important}
.tall-cap .ptitle{max-width:none;font-size:13px}
.lo-tall3 .tall-cap{padding:22px 6px 6px!important}
.lo-tall3 .tall-cap .ptitle{font-size:11.5px}
.plist .item .tall-cap .copies{display:flex;flex-wrap:wrap;gap:4px;max-width:none;width:100%;margin:0;overflow:visible;justify-content:flex-start}
.plist .item .tall-cap .copy-btn{flex:1 1 40%;min-width:0;height:28px;padding:0 6px;font-size:11.5px}
.plist .item.lo-tall3 .tall-cap .copy-btn{height:24px;font-size:10.5px;padding:0 4px}
.plist .item.btn-short .tall-info .copy-btn,.plist .item.btn-short .tall-cap .copy-btn{flex:0 0 auto;padding:0 12px}
.plist .item.lo-tall3.btn-short .tall-info .copy-btn,.plist .item.lo-tall3.btn-short .tall-cap .copy-btn{padding:0 9px}
/* 세로형: 버튼 2개까지는 제목과 한 줄(버튼은 오른쪽부터), 3개부터 위아래 */
.plist .item .tall-info.few,.plist .item .tall-cap.few{display:flex!important;align-items:center;gap:6px}
.plist .item .few .ptitle{flex:1 1 auto!important;min-width:0!important;max-width:none}
.plist .item .few .copies{flex:0 0 auto;width:auto;flex-wrap:nowrap;justify-content:flex-end;margin-left:auto}
.plist .item .few .copy-btn{flex:0 0 auto!important;padding:0 10px}
.plist .item.lo-tall3 .few .copy-btn{padding:0 7px}
.plist .item.lo-tall3 .tall-info .copy-btn{height:26px;font-size:11px;padding:0 4px}
@media (min-width:720px){
  .wrap{max-width:820px}
  /* 2칸씩, 마지막이 홀수면 가운데 */
  .plist{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:20px}
  .plist>.item{width:calc(50% - 10px)}
  .plist{column-gap:20px;row-gap:20px}
  .plist>.item.lo-tall2{width:calc((100% - 40px) / 3)}
  .plist>.item.lo-tall3{width:calc((100% - 60px) / 4)}
  #view.pc-col .plist{flex-direction:column;align-items:center}
  #view.pc-col .plist>.item{width:min(100%,560px)}
  #view>.list{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
  #view>.list>.folder{width:calc(50% - 7px)}
  .wrap{padding:36px 28px 48px}
  h1{font-size:20px}
}
/* PC: 크게, 화면 가운데에 */
@media (min-width:900px){
  .wrap{justify-content:center;padding-top:48px;padding-bottom:48px}
  main{flex:0 0 auto;padding-bottom:0}
  footer{padding-top:48px}
}
@media (min-width:1400px){html{zoom:1.2;--z:1.2}}
@media (min-width:1700px){html{zoom:1.4;--z:1.4}}
@media (min-width:2100px){html{zoom:1.65;--z:1.65}}
.pimg{position:relative;aspect-ratio:2/1;border-radius:14px;overflow:hidden;cursor:pointer;margin-bottom:4px}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;cursor:pointer;min-height:48px}
.ptitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;min-width:0;flex:0 1 auto}
.phint{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phint .h-close{display:none}
.item.open .phint .h-open{display:none}
.item.open .phint .h-close{display:inline}
.edit-ic{position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;background:none;padding:0;display:grid;place-items:center;cursor:pointer;z-index:2}
.edit-ic svg{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pbar .edit-ic{position:static;width:28px;height:28px}
.pbar .edit-ic svg{filter:none}
.copies{display:flex;flex-wrap:nowrap;gap:6px;margin-left:auto;flex:0 1 auto;min-width:0;max-width:62%;overflow-x:auto;scrollbar-width:none}
.copies::-webkit-scrollbar{display:none}
/* 버튼 4개까지는 스크롤 없이 한 줄에 다 (좁으면 버튼이 조금씩 줄어듦), 5개부터 옆으로 스크롤 */
.copies:not(.many){overflow:visible;max-width:none;flex:1 1 auto;justify-content:flex-end}
.copies:not(.many) .copy-btn{flex:0 1 auto;min-width:0;padding:0 clamp(8px,2.6vw,14px)}
.sinfo{flex:1;min-width:0;display:grid;gap:8px}
.sline{display:flex;align-items:center;gap:8px;min-width:0}
.sline .ptitle{max-width:none;min-width:0!important;flex:0 1 auto}
.pside .copies{max-width:100%;width:100%}
.pside .copies>:first-child{margin-left:auto}
.copies .copy-btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptitle{flex:0 0 auto!important}
.texts{display:grid;gap:10px}
.cpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cpick button,.cpick label{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.12);padding:0;cursor:pointer;position:relative;flex:none}
.cpick .on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #111}
.cpick .c-def{background:#fff;font-size:9px;color:var(--sub);width:auto;padding:0 8px;border-radius:999px}
.cpick label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.cpick label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:none}

.th-glass .ov-cap,.th-glass .edit-ic{z-index:2}

.th-glass .copy-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 75%,rgba(255,255,255,.1) 100%)}
/* 박스 테마: 텍스트만 */

.obar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}

.n-up{top:0;left:50%;margin-left:-14px}

.n-left{left:0;top:50%;margin-top:-14px;width:22px;height:28px}.n-left svg{transform:rotate(-90deg)}

</style>

function moveRow(from, to){

  const before = new Map([...document.querySelectorAll(".orow")].map(el => [el.dataset.oid, el.getBoundingClientRect().top]));
  const ids = reorder.ids; const [x] = ids.splice(from, 1); ids.splice(to, 0, x);

  document.querySelectorAll(".orow").forEach(el => {
    const dy = before.get(el.dataset.oid) - el.getBoundingClientRect().top;
    if (!dy) return;
    el.style.transform = `translateY(${dy}px)`; el.style.transition = "none";
    requestAnimationFrame(() => { el.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1)"; el.style.transform = ""; });

}
function removeRow(id){

    const before = new Map([...document.querySelectorAll(".orow")].map(r => [r.dataset.oid, r.getBoundingClientRect().top]));
    reorder.ids = reorder.ids.filter(x => x !== id); reorder.removed.add(id);

async function finishReorder(save){
  if (save) {
    const n = reorder.removed.size, isFolders = reorder.kind === "folders";
    if (n && !confirm(isFolders ? `${n}개를 삭제할까요? 폴더는 안의 프롬프트도 같이 지워지고, 그룹은 안의 폴더가 첫 화면으로 나와요.` : `프롬프트 ${n}개를 삭제할까요?`)) return;
    try {
      const batch = writeBatch(db);
      reorder.ids.forEach((id, i) => batch.update(doc(db, SITE.col, id), { order: i }));
      for (const id of reorder.removed) {
        batch.delete(doc(db, SITE.col, id)); batch.delete(ORIG(id));
        if (isFolders && isGroup(reorder.map[id])) { childFolders(id).forEach(k => batch.update(doc(db, SITE.col, k.id), { parentId: null })); continue; }
        if (isFolders) for (const fid of [id, ...descendants(id)]) {
          if (fid !== id) { batch.delete(doc(db, SITE.col, fid)); batch.delete(ORIG(fid)); }
          (await getDocs(query(col, where("folderId", "==", fid)))).docs.forEach(d => { batch.delete(d.ref); batch.delete(ORIG(d.id)); });
        }
      }
      await batch.commit(); toast(n ? "저장하고 삭제했어요" : "순서를 저장했어요");
    } catch(_) { toast("저장 실패: 권한을 확인해주세요"); return; }
  }
  reorder = null; render();
  if (history.state?.reorder) history.back();
}

// ---------- 이미지 편집기: 드래그로 위치, 슬라이더로 확대 ----------
let fileTarget = null;
const ARW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`;
function makeEditor(pickerId, toolsId, gradId, maxW, maxH){
  const st = { image:"", imgX:50, imgY:50, zoom:1, grad:"white" };
  const picker = $("#" + pickerId), tools = $("#" + toolsId), gradEl = gradId ? $("#" + gradId) : document.createElement("div");
  tools.innerHTML = `
    <button type="button" class="btn sm press" data-act="pick">이미지 선택</button>
    <button type="button" class="btn sm ghost press" data-act="remove">제거</button>
    <span class="zoom-row" data-el="zoomRow"><span>확대</span><input type="range" min="1" max="3" step="0.01" aria-label="확대"></span>`;
  gradEl.innerHTML = `<button type="button" data-g="white">흰색</button><button type="button" data-g="black">검은색</button><button type="button" data-g="none">없음</button>`;
  const range = tools.querySelector("input");
  const applyImg = () => { const im = picker.querySelector("img"); if (im) im.style.cssText = imgStyle(st); };

  function paint(){
    if (st.image) {
      picker.classList.add("has");
      picker.innerHTML = `<div class="media"><img src="${st.image}" alt="" draggable="false" style="${imgStyle(st)}"></div>
        <button type="button" class="nudge n-up" data-nx="0" data-ny="1" aria-label="위로">${ARW}</button>
        <button type="button" class="nudge n-down" data-nx="0" data-ny="-1" aria-label="아래로">${ARW}</button>
        <button type="button" class="nudge n-left" data-nx="1" data-ny="0" aria-label="왼쪽으로">${ARW}</button>
        <button type="button" class="nudge n-right" data-nx="-1" data-ny="0" aria-label="오른쪽으로">${ARW}</button>`;
    } else {
      picker.classList.remove("has");
      picker.innerHTML = `<div class="empty-hint">이미지 추가 (선택)</div>`;
    }
    tools.querySelector('[data-act="remove"]').hidden = !st.image;
    tools.querySelector('[data-act="pick"]').textContent = st.image ? "이미지 변경" : "이미지 선택";
    tools.querySelector('[data-el="zoomRow"]').hidden = !st.image; range.value = st.zoom;

    gradEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.g === st.grad));
  }
  const pick = () => { fileTarget = api; $("#fileIn").click(); };
  tools.addEventListener("click", e => {
    const a = e.target.closest("[data-act]")?.dataset.act;
    if (a === "pick") pick();
    if (a === "remove") { st.image = ""; paint(); }
  });
  gradEl.addEventListener("click", e => { const g = e.target.closest("[data-g]")?.dataset.g; if (g) { st.grad = g; paint(); } });
  range.addEventListener("input", () => { st.zoom = +range.value; applyImg(); });
  picker.addEventListener("click", () => { if (!st.image) pick(); });

  // 화살표: 누르면 한 칸, 꾹 누르면 계속 이동
  let hold = null;
  const nudge = (nx, ny) => {
    const step = 4 / st.zoom;
    st.imgX = Math.max(0, Math.min(100, st.imgX + nx * step));
    st.imgY = Math.max(0, Math.min(100, st.imgY + ny * step));
    applyImg();
  };
  picker.addEventListener("pointerdown", e => {
    const b = e.target.closest(".nudge"); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    const nx = +b.dataset.nx, ny = +b.dataset.ny;
    nudge(nx, ny);
    clearInterval(hold); clearTimeout(hold);
    hold = setTimeout(() => { hold = setInterval(() => nudge(nx, ny), 60); }, 350);
    const stop = () => { clearTimeout(hold); clearInterval(hold); window.removeEventListener("pointerup", stop); window.removeEventListener("pointercancel", stop); };
    window.addEventListener("pointerup", stop); window.addEventListener("pointercancel", stop);
  }, true);

  let drag = null;
  picker.addEventListener("pointerdown", e => {
    if (!st.image || e.target.closest(".nudge")) return;
    drag = { x: e.clientX, y: e.clientY, ox: st.imgX, oy: st.imgY, w: picker.clientWidth, h: picker.clientHeight };
    picker.setPointerCapture(e.pointerId);
  });
  picker.addEventListener("pointermove", e => {
    if (!drag) return;
    const k = 1.6 / st.zoom;
    st.imgX = Math.max(0, Math.min(100, drag.ox - (e.clientX - drag.x) / drag.w * 100 * k));
    st.imgY = Math.max(0, Math.min(100, drag.oy - (e.clientY - drag.y) / drag.h * 100 * k));
    applyImg();
  });
  const end = () => { drag = null; };
  picker.addEventListener("pointerup", end); picker.addEventListener("pointercancel", end);

  const api = {
    maxW, maxH,
    load(o){ Object.assign(st, { image: o.image || "", imgX: num(o.imgX,50), imgY: num(o.imgY,50), zoom: num(o.zoom,1), grad: o.grad || "white" }); paint(); },
    setImage(src){ Object.assign(st, { image: src, imgX:50, imgY:50, zoom:1 }); paint(); },
    data(){ return { image: st.image, imgX: Math.round(st.imgX*10)/10, imgY: Math.round(st.imgY*10)/10, zoom: Math.round(st.zoom*100)/100, grad: st.grad }; }
  };
  return api;
}
// 화면에 보이는 크기에 맞춰 작게 저장 (폴더 4:1, 프롬프트 2:1)

const ORIG = id => doc(db, SITE.col, id + "_orig"); // 원본은 따로 (수정할 때만 불러옴)
const bakeSize = (kind, layout) => kind === "folder" ? (RATIO_PX[viewCfg.folderRatio] || RATIO_PX["4/1"]) : layout === "side" ? [500, 500] : (layout === "tall2" || layout === "tall3") ? [600, 800] : [1200, 600];
async function bake(src, W, H, x = 50, y = 50, z = 1){
  const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingQuality = "high";
  // 화면의 object-fit:cover + object-position + 확대와 똑같이 계산
  const s = Math.max(W / im.width, H / im.height), dw = im.width * s, dh = im.height * s;
  const ox = (W - dw) * x / 100, oy = (H - dh) * y / 100, Ox = W * x / 100, Oy = H * y / 100;
  ctx.drawImage(im, Ox + (ox - Ox) * z, Oy + (oy - Oy) * z, dw * z, dh * z);
  let q = .88, out = c.toDataURL("image/jpeg", q);
  while (out.length > 200000 && q > .6) { q -= .05; out = c.toDataURL("image/jpeg", q); }
  return out;
}
// 저장 데이터 만들기: 화면용(잘린 것) + 원본 따로
async function withBaked(id, kind, layout, ed){
  const d = ed.data();
  if (!d.image) return { data: { ...d, image: "", baked: false }, orig: null };
  const [W, H] = bakeSize(kind, layout);
  const shown = await bake(d.image, W, H, d.imgX, d.imgY, d.zoom);
  return { data: { ...d, image: shown, baked: true }, orig: d.image };
}
async function saveOrig(id, orig){
  if (orig) await setDoc(ORIG(id), { type: "orig", image: orig });
  else await deleteDoc(ORIG(id)).catch(() => {});
}
// 수정 창 열 때 원본 불러오기
async function loadOriginal(id, o, ed){
  if (!o.image || !o.baked) { ed.load(o); return; }
  ed.load({ ...o, imgX: 50, imgY: 50, zoom: 1 }); // 원본 오기 전 잠깐
  try {
    const snap = await getDoc(ORIG(id));
    if (snap.exists()) ed.load({ ...o, image: snap.data().image });
  } catch(_) {}
}

async function resizeImage(file, maxW, maxH){
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const scale = Math.min(1, maxW / im.width, maxH / im.height);
    const c = document.createElement("canvas");
    c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height); // 투명 배경(PNG)은 흰색으로
    ctx.drawImage(im, 0, 0, c.width, c.height);
    // 화질 우선: 0.9에서 시작해 너무 클 때만 조금씩 낮춤 (최대 약 0.3MB)
    let q = .9, out = c.toDataURL("image/jpeg", q);
    while (out.length > 420000 && q > .6) { q -= .05; out = c.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

    btn.hidden = true;
    toast(all.length ? `이미지 ${all.length}개를 가볍게 바꿨어요` : "바꿀 이미지가 없어요");
  } catch(_) { toast("변환 중 문제가 생겼어요. 다시 눌러주세요"); }
  btn.disabled = false;
};

// ---------- 백업 (이때만 전체를 받아요) ----------
$("#backupBtn").onclick = async () => {
  try {
    const all = (await getDocs(col)).docs.map(d => ({ id: d.id, ...d.data() }));
    const origOf = id => all.find(d => d.id === id + "_orig")?.image;
    const strip = o => { const { id, created, updated, type, folderId, ...rest } = o; const original = origOf(id); return original ? { ...rest, original } : rest; };
    const data = all.filter(d => d.type === "folder").sort((a,b) => folderKey(a) - folderKey(b))
      .map(f => ({ ...strip(f), prompts: all.filter(p => p.folderId === f.id && p.type !== "folder").sort((a,b) => promptKey(a) - promptKey(b)).map(strip) }));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    a.download = `프롬프트_백업_${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch(_) { toast("백업 실패"); }
};

// ---------- 로그인 ----------
onAuthStateChanged(auth, u => {
  user = u;
  $("#loginBtn").hidden = !!u;
  $("#logoutBtn").hidden = !u;
  $("#who").hidden = !u || isAdmin();
  $("#who").textContent = u && !isAdmin() ? u.email + " · 보기 전용" : "";
  refilter();
  render();
});
$("#loginBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") signInWithRedirect(auth, provider);
    else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("로그인 실패: " + e.code);
  }
};
$("#logoutBtn").onclick = () => signOut(auth);

watchPrompts();
</script>
</body>
</html>
