<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--text:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;
  --accent:#3b5bdb;--accent-soft:#e7ecff;--danger:#d6336c;--chip:#efede8;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141416;--card:#1e1e22;--text:#f1f1f3;--muted:#9a9aa2;--line:#2e2e34;
  --accent:#7c94ff;--accent-soft:#252c4a;--danger:#ff6b9a;--chip:#2a2a30;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:200px;resize:vertical}
.search{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:none;background:var(--chip);color:var(--muted);padding:6px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.cat{font-size:.78rem;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
.body{white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:.92rem;margin:10px 0 12px;max-height:7.5em;overflow:hidden}
.body.open{max-height:none}
.empty{text-align:center;color:var(--muted);padding:48px 0}
.status{font-size:.85rem;color:var(--muted);margin-bottom:12px;min-height:1.2em}
.who{font-size:.8rem;color:var(--muted)}
dialog{border:none;border-radius:16px;padding:0;width:min(560px,calc(100% - 32px));background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h2{margin:0;font-size:1.15rem}
label{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 프롬프트 보관함</h1>
    <div class="row">
      <span class="who" id="who"></span>
      <button class="btn primary" id="addBtn" hidden>+ 새 프롬프트</button>
      <button class="btn" id="loginBtn" hidden>Google 로그인</button>
      <button class="btn" id="logoutBtn" hidden>로그아웃</button>
    </div>
  </header>

  <input class="search" id="q" placeholder="검색 (제목, 내용, 카테고리)">
  <div class="chips" id="chips"></div>
  <div class="status" id="status"></div>
  <div class="list" id="list"></div>
</div>

<dialog id="editDlg">
  <form class="dlg" id="editForm">
    <h2 id="editTitle">새 프롬프트</h2>
    <label>제목<input id="fTitle" required></label>
    <label>카테고리<input id="fCat" list="catList" placeholder="예: 글쓰기, 코딩"></label>
    <datalist id="catList"></datalist>
    <label>프롬프트 내용<textarea id="fBody" required></textarea></label>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn danger" id="delBtn" hidden>삭제</button>
      <div class="row" style="margin-left:auto">
        <button type="button" class="btn" id="cancelBtn">취소</button>
        <button type="submit" class="btn primary" id="saveBtn">저장</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script type="module">
// ================== 설정 ==================
// Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에서 복사한 값을 넣으세요.
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};
// 수정 권한을 줄 구글 계정 이메일
const ADMINS = ["j03243619@gmail.com"];
// ==========================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
let prompts = [], activeCat = "전체", editingId = null, user = null;
const isAdmin = () => !!user && ADMINS.includes(user.email);

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function setStatus(m){ $("#status").textContent = m || ""; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const ts = v => v?.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0);

function render(){
  $("#addBtn").hidden = !isAdmin();
  const cats = ["전체", ...[...new Set(prompts.map(p => p.category).filter(Boolean))].sort()];
  if (!cats.includes(activeCat)) activeCat = "전체";
  $("#chips").innerHTML = cats.map(c => `<button class="chip ${c===activeCat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#catList").innerHTML = cats.slice(1).map(c => `<option value="${esc(c)}">`).join("");

  const q = $("#q").value.trim().toLowerCase();
  const items = prompts
    .filter(p => activeCat === "전체" || p.category === activeCat)
    .filter(p => !q || [p.title, p.content, p.category].join(" ").toLowerCase().includes(q))
    .sort((a,b) => ts(b.updated) - ts(a.updated));

  if (!items.length) {
    $("#list").innerHTML = `<div class="empty">${prompts.length ? "검색 결과가 없어요" : (isAdmin() ? "아직 프롬프트가 없어요. ‘+ 새 프롬프트’로 추가해보세요!" : "아직 프롬프트가 없어요.")}</div>`;
    return;
  }
  $("#list").innerHTML = items.map(p => `
    <div class="card">
      <h3>${esc(p.title)}</h3>${p.category ? `<span class="cat">${esc(p.category)}</span>` : ""}
      <div class="body" data-id="${p.id}">${esc(p.content)}</div>
      <div class="row">
        <button class="btn sm primary" data-copy="${p.id}">복사</button>
        <button class="btn sm" data-more="${p.id}">펼치기</button>
        ${isAdmin() ? `<button class="btn sm" data-edit="${p.id}">수정</button>` : ""}
      </div>
    </div>`).join("");
}

$("#q").addEventListener("input", render);
$("#chips").addEventListener("click", e => { const c = e.target.dataset.c; if (c) { activeCat = c; render(); } });
$("#list").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.copy) {
    const p = prompts.find(x => x.id === t.dataset.copy);
    try { await navigator.clipboard.writeText(p.content); }
    catch(_) { const ta=document.createElement("textarea"); ta.value=p.content; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    toast("복사됐어요");
  }
  if (t.dataset.more) {
    const b = document.querySelector(`.body[data-id="${t.dataset.more}"]`);
    b.classList.toggle("open"); t.textContent = b.classList.contains("open") ? "접기" : "펼치기";
  }
  if (t.dataset.edit) openEdit(t.dataset.edit);
});

function openEdit(id){
  editingId = id || null;
  const p = prompts.find(x => x.id === id) || { title:"", category:"", content:"" };
  $("#editTitle").textContent = id ? "프롬프트 수정" : "새 프롬프트";
  $("#fTitle").value = p.title; $("#fCat").value = p.category || ""; $("#fBody").value = p.content;
  $("#delBtn").hidden = !id;
  $("#editDlg").showModal();
}
$("#addBtn").onclick = () => openEdit(null);
$("#cancelBtn").onclick = () => $("#editDlg").close();

// ---------- Firebase 미설정이면 prompts.json만 보여줌 ----------
if (!firebaseConfig.apiKey) {
  try { const r = await fetch("prompts.json", { cache:"no-store" }); prompts = r.ok ? (await r.json()).map((p,i)=>({id:p.id||String(i),...p})) : []; } catch(_) {}
  render();
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app), db = getFirestore(app);
  const col = collection(db, "prompts");

  setStatus("불러오는 중…");
  onSnapshot(col, snap => {
    prompts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setStatus(""); render();
  }, () => setStatus("불러오기에 실패했어요"));

  onAuthStateChanged(auth, u => {
    user = u;
    $("#loginBtn").hidden = !!u;
    $("#logoutBtn").hidden = !u;
    $("#who").textContent = u ? (isAdmin() ? u.email : u.email + " (보기 전용)") : "";
    render();
  });

  $("#loginBtn").onclick = async () => {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") signInWithRedirect(auth, provider);
      else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("로그인 실패: " + e.code);
    }
  };
  $("#logoutBtn").onclick = () => signOut(auth);

  $("#editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const data = { title: $("#fTitle").value.trim(), category: $("#fCat").value.trim(), content: $("#fBody").value, updated: serverTimestamp() };
    $("#saveBtn").disabled = true;
    try {
      if (editingId) await updateDoc(doc(db, "prompts", editingId), data);
      else await addDoc(col, data);
      $("#editDlg").close(); toast("저장됐어요 ✓");
    } catch (err) { toast("저장 실패: 권한을 확인해주세요"); }
    $("#saveBtn").disabled = false;
  });

  $("#delBtn").onclick = async () => {
    if (!confirm("이 프롬프트를 삭제할까요?")) return;
    try { await deleteDoc(doc(db, "prompts", editingId)); $("#editDlg").close(); toast("삭제했어요"); }
    catch (err) { toast("삭제 실패: 권한을 확인해주세요"); }
  };
}
</script>
</body>
</html>
