<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 보관함</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff;--text:#111111;--sub:#555555;--muted:#9a9a9a;--line:#ececec;--soft:#f5f5f5;--danger:#c0392b;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea,select{outline:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;min-height:32px}
.title{display:flex;align-items:center;gap:2px;min-width:0}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:none;background:none;font:inherit;font-size:24px;line-height:1;padding:0 8px 4px 0;cursor:pointer;color:var(--text)}
.row{display:flex;gap:6px;align-items:center}
.desc{white-space:pre-wrap;word-break:break-word;color:var(--sub);font-size:13px;line-height:1.6;margin:4px 0 20px}
.title-edit{border:none;background:none;padding:4px;margin-left:4px;cursor:pointer;display:grid;place-items:center;flex:none}
.title-edit svg{width:16px;height:16px}

/* 관리 줄 (폴더 편집 / 순서 바꾸기) */
.admin-bar{display:flex;gap:4px;margin:-6px 0 12px}
.link{border:none;background:none;font:inherit;font-size:12px;color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer}
.link:hover{background:var(--soft);color:var(--sub)}
.link:first-child{margin-left:-8px}
footer{display:flex;justify-content:center;gap:4px;padding-top:40px}

.press{transition:transform .38s cubic-bezier(.34,1.56,.64,1),background-color .18s var(--ease),border-color .18s var(--ease),opacity .18s;touch-action:manipulation}
.press.is-pressed{transform:scale(.95);transition:transform .12s var(--ease),background-color .12s,opacity .12s}
.pimg.press.is-pressed,.pbar.press.is-pressed,.folder.press.is-pressed{transform:scale(.98)}
#view.enter{animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog.closing{animation:pop-out .16s var(--ease) forwards}
dialog.closing::backdrop{opacity:0;transition:opacity .16s}
@keyframes pop-out{to{opacity:0;transform:translateY(6px) scale(.98)}}

.item{display:grid}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--ease),opacity .3s var(--ease),margin .36s var(--ease);opacity:0}
.expand>div{overflow:hidden}
.item.open .expand{grid-template-rows:1fr;opacity:1;margin-top:4px}
.expand-inner{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6;color:var(--sub);background:var(--soft);border-radius:12px;padding:12px 14px}

.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);height:30px;padding:0 10px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:#f1f1f1;border-color:#f1f1f1;color:var(--text);font-weight:600}
.btn.primary:hover{background:#e8e8e8}
.btn.ghost{border-color:transparent;color:var(--sub);background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5}

input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;transition:border-color .15s}
input:focus,textarea:focus{border-color:#cfcfcf}
textarea{min-height:140px;resize:vertical;line-height:1.55}
textarea.short{min-height:70px}

.box{border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.list{display:grid;gap:10px}
.media{position:absolute;inset:0;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}

.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px 14px;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-white .cap{color:var(--text);background:linear-gradient(to top,rgba(255,255,255,.85),rgba(255,255,255,0))}
.g-black .cap{color:#fff;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0))}
.g-none .cap{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.no-img .cap{top:0;bottom:0;display:flex;align-items:center;padding:0 16px;color:var(--text);background:none;text-shadow:none}

.folder{position:relative;display:block;width:100%;aspect-ratio:4/1;padding:0;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer}

.plist{display:grid;gap:16px}
.pimg{position:relative;aspect-ratio:2/1;border-radius:14px;overflow:hidden;cursor:pointer;margin-bottom:4px}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;cursor:pointer;min-height:48px}
.ptitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.phint{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phint .h-close{display:none}
.item.open .phint .h-open{display:none}
.item.open .phint .h-close{display:inline}
.edit-ic{position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;background:none;padding:0;display:grid;place-items:center;cursor:pointer;z-index:2}
.edit-ic svg{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pbar .edit-ic{position:static;width:28px;height:28px}
.pbar .edit-ic svg{filter:none}
.copy-btn{flex:none;height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#111;font:inherit;font-size:12px;font-weight:600;cursor:pointer}

/* 순서 바꾸기 */
.olist{display:grid;gap:8px}
.orow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;border:1px solid var(--line);border-radius:12px;background:#fff}
.othumb{width:52px;height:30px;border-radius:6px;background:var(--soft);object-fit:cover;flex:none}
.oname{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oarrow{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--sub);font-size:14px}
.oarrow:disabled{opacity:.3}
.obar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:13px}
.status{font-size:12px;color:var(--muted)}
.who{font-size:11px;color:var(--muted);text-align:center}

dialog{border:none;border-radius:16px;padding:0;overflow-x:hidden;width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--bg);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.14)}
dialog[open]{animation:pop .22s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.25)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dlg{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.dlg h2{margin:0;font-size:15px;font-weight:700}
label{font-size:12px;color:var(--sub);display:grid;gap:5px}
.picker{position:relative;border:1px dashed #d4d4d4;border-radius:12px;background:var(--soft);overflow:hidden;color:var(--muted);font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
.picker.r21{aspect-ratio:2/1}
.picker.r41{aspect-ratio:4/1}
.picker .empty-hint{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.picker.has{cursor:grab;border-style:solid}
.picker .drag-hint{position:absolute;left:8px;top:8px;font-size:11px;background:rgba(255,255,255,.9);color:var(--sub);padding:2px 8px;border-radius:999px;pointer-events:none}
.tools{display:flex;gap:6px;align-items:center}
.tools input[type=range]{flex:1;padding:0;border:none;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:#e6e6e6}
.tools input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #d0d0d0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #d0d0d0}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;height:28px;border:none;border-radius:6px;background:transparent;font:inherit;font-size:12px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.08);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.22s var(--ease);pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <button class="back press" id="backBtn" hidden aria-label="뒤로">‹</button>
      <h1 id="pageTitle">프롬프트 보관함</h1>
      <button class="title-edit press" id="folderEditBtn" hidden aria-label="폴더 편집"><svg viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
    <button class="btn primary press" id="addBtn" hidden>추가</button>
  </header>
  <main>
    <div class="desc" id="desc" hidden></div>
    <div class="status" id="status"></div>
    <div id="view"></div>
  </main>
  <footer>
    <span class="who" id="who" hidden></span>
    <button class="link press" id="reorderBtn" hidden>폴더 순서 바꾸기</button>
    <button class="link press" id="backupBtn" hidden>백업</button>
    <button class="link press" id="loginBtn" hidden>관리자 로그인</button>
    <button class="link press" id="logoutBtn" hidden>로그아웃</button>
  </footer>
</div>

<dialog id="folderDlg">
  <form class="dlg" id="folderForm">
    <h2 id="folderDlgTitle">새 폴더</h2>
    <div class="picker r41" id="fPicker"></div>
    <div class="tools" id="fTools"></div>
    <label>글씨 배경<div class="seg" id="fGrad"></div></label>
    <label>제목<input id="fName" required placeholder="폴더 이름"></label>
    <label>안내글 (폴더 맨 위에 보여요)<textarea class="short" id="fDesc" placeholder="선택"></textarea></label>
    <button type="button" class="btn press" id="promptReorderBtn" hidden>프롬프트 순서 바꾸기</button>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn danger press" id="folderDelBtn" hidden>삭제</button>
      <div class="row" style="margin-left:auto">
        <button type="button" class="btn press" data-close="folderDlg">취소</button>
        <button type="submit" class="btn primary press" id="folderSave">저장</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="promptDlg">
  <form class="dlg" id="promptForm">
    <h2 id="promptDlgTitle">새 프롬프트</h2>
    <div class="picker r21" id="pPicker"></div>
    <div class="tools" id="pTools"></div>
    <label>제목<input id="pTitle" placeholder="카드에 보이는 제목"></label>
    <label>프롬프트<textarea id="pBody" required placeholder="복사될 프롬프트 내용"></textarea></label>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn danger press" id="promptDelBtn" hidden>삭제</button>
      <div class="row" style="margin-left:auto">
        <button type="button" class="btn press" data-close="promptDlg">취소</button>
        <button type="submit" class="btn primary press" id="promptSave">저장</button>
      </div>
    </div>
  </form>
</dialog>

<input type="file" id="fileIn" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script type="module">
// ================== 설정 ==================
const firebaseConfig = {
  apiKey: "AIzaSyAyOmjnKoXiyKXyUCnvqRkADH25ZgnWgwY",
  authDomain: "puppylove-b7026.firebaseapp.com",
  projectId: "puppylove-b7026",
  appId: "1:1025480055512:web:28c07922509a8b922255ad"
};
const ADMINS = ["j03243619@gmail.com"];
// ==========================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, getDocs, addDoc, updateDoc, deleteDoc, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const col = collection(db, "prompts"); // 폴더와 프롬프트를 한 곳에 저장 (type으로 구분)

const $ = s => document.querySelector(s);
let folderDocs = [], promptDocs = [], promptsFor = null, promptsReady = false;
let user = null, editingFolder = null, editingPrompt = null, reorder = null;
const openItems = new Set();
const isAdmin = () => !!user && ADMINS.includes(user.email);

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const ts = v => v?.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0);
const num = (v, d) => (typeof v === "number" && isFinite(v)) ? v : d;
const currentFolderId = () => { const m = location.hash.match(/^#\/f\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; };

// 정렬: 순서(order)가 있으면 그 순서, 없으면 폴더는 만든 순 / 프롬프트는 최신이 위
const folderKey = f => num(f.order, ts(f.created) / 1e3);
const promptKey = p => num(p.order, -ts(p.created || p.updated) / 1e3);
const folders = () => [...folderDocs].sort((a,b) => folderKey(a) - folderKey(b));
const prompts = () => [...promptDocs].sort((a,b) => promptKey(a) - promptKey(b));

function imgStyle(o){
  const x = num(o.imgX, 50), y = num(o.imgY, 50), z = num(o.zoom, 1);
  return `object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%`;
}
const mediaHtml = o => o.image ? `<div class="media"><img src="${o.image}" alt="" loading="lazy" style="${imgStyle(o)}"></div>` : "";
const gradClass = o => o.image ? "g-" + (o.grad || "white") : "no-img";
const pencil = light => `<svg viewBox="0 0 24 24" fill="none" stroke="${light ? "#fff" : "#8a8a8a"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

// ---------- 데이터: 첫 화면은 폴더만, 폴더 안에선 그 폴더 프롬프트만 받기 ----------
$("#status").textContent = "불러오는 중…";
let foldersReady = false;
onSnapshot(query(col, where("type", "==", "folder")), snap => {
  folderDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  foldersReady = true; $("#status").textContent = "";
  render();
}, () => { $("#status").textContent = "불러오기에 실패했어요"; });

let unsubPrompts = null;
function watchPrompts(){
  const fid = currentFolderId();
  if (fid === promptsFor) return;
  unsubPrompts?.(); unsubPrompts = null;
  promptsFor = fid; promptDocs = []; promptsReady = false;
  if (!fid) return;
  unsubPrompts = onSnapshot(query(col, where("folderId", "==", fid)), snap => {
    promptDocs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.type !== "folder");
    promptsReady = true;
    render();
  }, () => { $("#status").textContent = "불러오기에 실패했어요"; });
}

// ---------- 화면 ----------
function render(){
  const fid = currentFolderId();
  const admin = isAdmin();
  $("#backBtn").hidden = !fid;
  $("#addBtn").hidden = !admin || !!reorder;
  $("#backupBtn").hidden = !admin;
  $("#desc").hidden = true;
  $("#folderEditBtn").hidden = !admin || !fid || !!reorder;
  $("#reorderBtn").hidden = true;

  if (!fid) {
    $("#pageTitle").textContent = "프롬프트 보관함";
    $("#addBtn").textContent = "새 폴더";
    const list = folders();
    $("#reorderBtn").hidden = !admin || list.length < 2 || !!reorder;
    if (reorder) return renderReorder();
    if (!foldersReady) { $("#view").innerHTML = ""; return; }
    if (!list.length) {
      $("#view").innerHTML = `<div class="empty">${admin ? "‘새 폴더’를 눌러 첫 폴더를 만들어보세요." : "아직 폴더가 없어요."}</div>`;
      return;
    }
    $("#view").innerHTML = `<div class="list">${list.map(f => `
      <button class="box folder press ${gradClass(f)}" data-open="${esc(f.id)}">
        ${mediaHtml(f)}
        <span class="cap">${esc(f.name)}</span>
      </button>`).join("")}</div>`;
    return;
  }

  const folder = folderDocs.find(d => d.id === fid);
  if (!folder) {
    $("#pageTitle").textContent = foldersReady ? "폴더를 찾을 수 없어요" : "";
    $("#view").innerHTML = ""; $("#addBtn").hidden = true; $("#folderEditBtn").hidden = true; return;
  }
  $("#pageTitle").textContent = folder.name;
  if (folder.desc) { $("#desc").textContent = folder.desc; $("#desc").hidden = false; }
  $("#addBtn").textContent = "추가";
  const items = prompts();
  if (reorder) return renderReorder();
  if (!promptsReady) { $("#view").innerHTML = `<div class="status">불러오는 중…</div>`; return; }
  if (!items.length) {
    $("#view").innerHTML = `<div class="empty">${admin ? "‘추가’를 눌러 프롬프트를 넣어보세요." : "아직 프롬프트가 없어요."}</div>`;
    return;
  }
  $("#view").innerHTML = `<div class="plist">${items.map(p => `
    <div class="item ${openItems.has(p.id) ? "open" : ""}" id="it-${p.id}">
      ${p.image ? `<div class="box pimg press" data-tog="${p.id}">
        ${mediaHtml(p)}
        ${admin ? `<button class="edit-ic press" data-edit="${p.id}" aria-label="수정">${pencil(true)}</button>` : ""}
      </div>` : ""}
      <div class="box pbar press" data-tog="${p.id}">
        <span class="ptitle">${esc(p.title || "제목 없음")}</span>
        <span class="phint"><span class="h-open">눌러서 전체 프롬프트 보기</span><span class="h-close">눌러서 접기</span></span>
        ${!p.image && admin ? `<button class="edit-ic press" data-edit="${p.id}" aria-label="수정">${pencil(false)}</button>` : ""}
        <button class="copy-btn press" data-copy="${p.id}">복사</button>
      </div>
      <div class="expand"><div><div class="expand-inner">${esc(p.content)}</div></div></div>
    </div>`).join("")}</div>`;
}

// ---------- 순서 바꾸기 ----------
function renderReorder(){
  const rows = reorder.ids.map(id => reorder.map[id]);
  $("#view").innerHTML = `
    <div class="obar"><span>화살표로 순서를 바꾸세요</span>
      <span class="row"><button class="btn sm press" id="oCancel">취소</button><button class="btn sm primary press" id="oDone">완료</button></span></div>
    <div class="olist">${rows.map((o, i) => `
      <div class="orow" data-oid="${o.id}">
        ${o.image ? `<img class="othumb" src="${o.image}" alt="" style="${imgStyle(o)}">` : `<span class="othumb"></span>`}
        <span class="oname">${esc(o.name || o.title || "제목 없음")}</span>
        <button class="oarrow press" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="위로">▲</button>
        <button class="oarrow press" data-down="${i}" ${i === rows.length - 1 ? "disabled" : ""} aria-label="아래로">▼</button>
      </div>`).join("")}</div>`;
}
function moveRow(from, to){
  // 부드럽게 자리 바꾸기 (FLIP)
  const before = new Map([...document.querySelectorAll(".orow")].map(el => [el.dataset.oid, el.getBoundingClientRect().top]));
  const ids = reorder.ids; const [x] = ids.splice(from, 1); ids.splice(to, 0, x);
  renderReorder();
  document.querySelectorAll(".orow").forEach(el => {
    const dy = before.get(el.dataset.oid) - el.getBoundingClientRect().top;
    if (!dy) return;
    el.style.transform = `translateY(${dy}px)`; el.style.transition = "none";
    requestAnimationFrame(() => { el.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1)"; el.style.transform = ""; });
  });
}
function startReorder(){
  const list = currentFolderId() ? prompts() : folders();
  reorder = { ids: list.map(o => o.id), map: Object.fromEntries(list.map(o => [o.id, o])) };
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}
$("#reorderBtn").onclick = startReorder;
$("#promptReorderBtn").onclick = () => { $("#folderDlg").close(); setTimeout(startReorder, 160); };
async function finishReorder(save){
  if (save) {
    try {
      const batch = writeBatch(db);
      reorder.ids.forEach((id, i) => batch.update(doc(db, "prompts", id), { order: i }));
      await batch.commit(); toast("순서를 저장했어요");
    } catch(_) { toast("저장 실패: 권한을 확인해주세요"); return; }
  }
  reorder = null; render();
}

// ---------- 이동 / 클릭 ----------
function onRoute(){
  reorder = null; watchPrompts(); render(); window.scrollTo(0,0);
  const v = $("#view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
}
window.addEventListener("hashchange", onRoute);
$("#backBtn").onclick = () => { location.hash = ""; };

$("#view").addEventListener("click", e => {
  const t = e.target.closest("[data-edit],[data-copy],[data-open],[data-tog],[data-up],[data-down],#oDone,#oCancel");
  if (!t) return;
  if (t.id === "oDone") return finishReorder(true);
  if (t.id === "oCancel") return finishReorder(false);
  if (t.dataset.up) return moveRow(+t.dataset.up, +t.dataset.up - 1);
  if (t.dataset.down) return moveRow(+t.dataset.down, +t.dataset.down + 1);
  if (t.dataset.edit) return openPrompt(t.dataset.edit);
  if (t.dataset.copy) return copyText(promptDocs.find(x => x.id === t.dataset.copy)?.content || "");
  if (t.dataset.open) location.hash = "#/f/" + encodeURIComponent(t.dataset.open);
  if (t.dataset.tog) {
    const id = t.dataset.tog;
    openItems.has(id) ? openItems.delete(id) : openItems.add(id);
    document.getElementById("it-" + id)?.classList.toggle("open", openItems.has(id));
  }
});
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $("#" + b.dataset.close).close());

async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch(_) { const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("복사됐어요");
}

// 누를 때 들어갔다 튕기듯 돌아오는 효과
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".press"); if (!el || el.disabled) return;
  el.classList.add("is-pressed");
  const up = () => { el.classList.remove("is-pressed"); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); };
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
});
// 창 닫힐 때도 부드럽게
const _close = HTMLDialogElement.prototype.close;
HTMLDialogElement.prototype.close = function(...a){
  if (!this.open || this.classList.contains("closing")) return _close.apply(this, a);
  this.classList.add("closing");
  setTimeout(() => { this.classList.remove("closing"); _close.apply(this, a); }, 150);
};

// ---------- 이미지 편집기: 드래그로 위치, 슬라이더로 확대 ----------
let fileTarget = null;
function makeEditor(pickerId, toolsId, gradId, maxW, maxH){
  const st = { image:"", imgX:50, imgY:50, zoom:1, grad:"white" };
  const picker = $("#" + pickerId), tools = $("#" + toolsId), gradEl = gradId ? $("#" + gradId) : document.createElement("div");
  tools.innerHTML = `
    <button type="button" class="btn sm press" data-act="pick">이미지 선택</button>
    <button type="button" class="btn sm ghost press" data-act="remove">제거</button>
    <input type="range" min="1" max="3" step="0.01" aria-label="확대">`;
  gradEl.innerHTML = `<button type="button" data-g="white">흰색</button><button type="button" data-g="black">검은색</button><button type="button" data-g="none">없음</button>`;
  const range = tools.querySelector("input");
  const applyImg = () => { const im = picker.querySelector("img"); if (im) im.style.cssText = imgStyle(st); };

  function paint(){
    if (st.image) {
      picker.classList.add("has");
      picker.innerHTML = `<div class="media"><img src="${st.image}" alt="" draggable="false" style="${imgStyle(st)}"></div><span class="drag-hint">드래그로 위치 조절</span>`;
    } else {
      picker.classList.remove("has");
      picker.innerHTML = `<div class="empty-hint">이미지 추가 (선택)</div>`;
    }
    tools.querySelector('[data-act="remove"]').hidden = !st.image;
    tools.querySelector('[data-act="pick"]').textContent = st.image ? "이미지 변경" : "이미지 선택";
    range.hidden = !st.image; range.value = st.zoom;
    gradEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.g === st.grad));
  }
  const pick = () => { fileTarget = api; $("#fileIn").click(); };
  tools.addEventListener("click", e => {
    const a = e.target.closest("[data-act]")?.dataset.act;
    if (a === "pick") pick();
    if (a === "remove") { st.image = ""; paint(); }
  });
  gradEl.addEventListener("click", e => { const g = e.target.closest("[data-g]")?.dataset.g; if (g) { st.grad = g; paint(); } });
  range.addEventListener("input", () => { st.zoom = +range.value; applyImg(); });
  picker.addEventListener("click", () => { if (!st.image) pick(); });

  let drag = null;
  picker.addEventListener("pointerdown", e => {
    if (!st.image) return;
    drag = { x: e.clientX, y: e.clientY, ox: st.imgX, oy: st.imgY, w: picker.clientWidth, h: picker.clientHeight };
    picker.setPointerCapture(e.pointerId);
  });
  picker.addEventListener("pointermove", e => {
    if (!drag) return;
    const k = 1.6 / st.zoom;
    st.imgX = Math.max(0, Math.min(100, drag.ox - (e.clientX - drag.x) / drag.w * 100 * k));
    st.imgY = Math.max(0, Math.min(100, drag.oy - (e.clientY - drag.y) / drag.h * 100 * k));
    applyImg();
  });
  const end = () => { drag = null; };
  picker.addEventListener("pointerup", end); picker.addEventListener("pointercancel", end);

  const api = {
    maxW, maxH,
    load(o){ Object.assign(st, { image: o.image || "", imgX: num(o.imgX,50), imgY: num(o.imgY,50), zoom: num(o.zoom,1), grad: o.grad || "white" }); paint(); },
    setImage(src){ Object.assign(st, { image: src, imgX:50, imgY:50, zoom:1 }); paint(); },
    data(){ return { image: st.image, imgX: Math.round(st.imgX*10)/10, imgY: Math.round(st.imgY*10)/10, zoom: Math.round(st.zoom*100)/100, grad: st.grad }; }
  };
  return api;
}
// 화면에 보이는 크기에 맞춰 작게 저장 (폴더 4:1, 프롬프트 2:1)
const fEditor = makeEditor("fPicker", "fTools", "fGrad", 1000, 500);
const pEditor = makeEditor("pPicker", "pTools", null, 1000, 1000);

async function resizeImage(file, maxW, maxH){
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const scale = Math.min(1, maxW / im.width, maxH / im.height);
    const c = document.createElement("canvas");
    c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    let q = .8, out = c.toDataURL("image/jpeg", q);
    while (out.length > 140000 && q > .45) { q -= .07; out = c.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !fileTarget) return;
  try { fileTarget.setImage(await resizeImage(f, fileTarget.maxW, fileTarget.maxH)); } catch(_) { toast("이미지를 불러오지 못했어요"); }
});

// ---------- 추가 / 편집 ----------
$("#addBtn").onclick = () => currentFolderId() ? openPrompt(null) : openFolder(null);
$("#folderEditBtn").onclick = () => openFolder(currentFolderId());

function openFolder(id){
  editingFolder = id;
  const f = folderDocs.find(d => d.id === id) || {};
  $("#folderDlgTitle").textContent = id ? "폴더 편집" : "새 폴더";
  $("#fName").value = f.name || "";
  $("#fDesc").value = f.desc || "";
  fEditor.load(f);
  $("#folderDelBtn").hidden = !id;
  $("#promptReorderBtn").hidden = !id || prompts().length < 2;
  $("#folderDlg").showModal();
}
function openPrompt(id){
  editingPrompt = id;
  const p = promptDocs.find(d => d.id === id) || {};
  $("#promptDlgTitle").textContent = id ? "프롬프트 수정" : "새 프롬프트";
  $("#pTitle").value = p.title || "";
  $("#pBody").value = p.content || "";
  pEditor.load(p);
  $("#promptDelBtn").hidden = !id;
  $("#promptDlg").showModal();
}

async function withBusy(btnId, fn){
  const b = $("#" + btnId); b.disabled = true;
  try { await fn(); } finally { b.disabled = false; }
}
$("#folderForm").addEventListener("submit", e => {
  e.preventDefault();
  withBusy("folderSave", async () => {
    const name = $("#fName").value.trim(); if (!name) return;
    const data = { name, desc: $("#fDesc").value.trim(), ...fEditor.data(), updated: serverTimestamp() };
    try {
      if (editingFolder) await updateDoc(doc(db, "prompts", editingFolder), data);
      else {
        const last = folders().at(-1);
        await addDoc(col, { type: "folder", created: serverTimestamp(), order: last ? folderKey(last) + 1 : 0, ...data });
      }
      $("#folderDlg").close(); toast("저장됐어요");
    } catch(_) { toast("저장 실패: 권한을 확인해주세요"); }
  });
});
$("#folderDelBtn").onclick = async () => {
  try {
    const inside = (await getDocs(query(col, where("folderId", "==", editingFolder)))).docs;
    if (!confirm(inside.length ? `이 폴더와 안의 프롬프트 ${inside.length}개를 모두 삭제할까요?` : "이 폴더를 삭제할까요?")) return;
    await Promise.all(inside.map(d => deleteDoc(d.ref)));
    await deleteDoc(doc(db, "prompts", editingFolder));
    $("#folderDlg").close(); location.hash = ""; toast("삭제했어요");
  } catch(_) { toast("삭제 실패: 권한을 확인해주세요"); }
};

$("#promptForm").addEventListener("submit", e => {
  e.preventDefault();
  withBusy("promptSave", async () => {
    const data = { title: $("#pTitle").value.trim(), content: $("#pBody").value, ...pEditor.data(), updated: serverTimestamp() };
    try {
      if (editingPrompt) await updateDoc(doc(db, "prompts", editingPrompt), data);
      else {
        const first = prompts()[0]; // 새 프롬프트는 맨 위에
        await addDoc(col, { type: "prompt", folderId: currentFolderId(), created: serverTimestamp(), order: first ? promptKey(first) - 1 : 0, ...data });
      }
      $("#promptDlg").close(); toast("저장됐어요");
    } catch(_) { toast("저장 실패: 권한을 확인해주세요"); }
  });
});
$("#promptDelBtn").onclick = async () => {
  if (!confirm("이 프롬프트를 삭제할까요?")) return;
  try { await deleteDoc(doc(db, "prompts", editingPrompt)); $("#promptDlg").close(); toast("삭제했어요"); }
  catch(_) { toast("삭제 실패: 권한을 확인해주세요"); }
};

// ---------- 백업 (이때만 전체를 받아요) ----------
$("#backupBtn").onclick = async () => {
  try {
    const all = (await getDocs(col)).docs.map(d => ({ id: d.id, ...d.data() }));
    const strip = o => { const { id, created, updated, type, folderId, ...rest } = o; return rest; };
    const data = all.filter(d => d.type === "folder").sort((a,b) => folderKey(a) - folderKey(b))
      .map(f => ({ ...strip(f), prompts: all.filter(p => p.folderId === f.id && p.type !== "folder").sort((a,b) => promptKey(a) - promptKey(b)).map(strip) }));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    a.download = `프롬프트_백업_${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch(_) { toast("백업 실패"); }
};

// ---------- 로그인 ----------
onAuthStateChanged(auth, u => {
  user = u;
  $("#loginBtn").hidden = !!u;
  $("#logoutBtn").hidden = !u;
  $("#who").hidden = !u || isAdmin();
  $("#who").textContent = u && !isAdmin() ? u.email + " · 보기 전용" : "";
  render();
});
$("#loginBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") signInWithRedirect(auth, provider);
    else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("로그인 실패: " + e.code);
  }
};
$("#logoutBtn").onclick = () => signOut(auth);

watchPrompts();
</script>
